# Butterfly 主题站点级配置（覆盖主题默认值）
# 文档：https://butterfly.js.org/

# 顶部导航（Butterfly v5 格式）
menu:
  首页: / || fas fa-home
  说说: /shuoshuo/ || fas fa-comment-dots
  历程: /timeline/ || fas fa-stream
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  关于: /about/ || fas fa-heart

# 本地搜索（配合 hexo-generator-search）
search:
  use: local_search
  placeholder: 搜索文章...

local_search:
  enable: true

# 字数统计与阅读时长（hexo-wordcount）
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# 不蒜子站点访问量统计
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# 侧栏
aside:
  enable: true
  card_author:
    enable: true
    description: 基于 Hexo 与 GitHub Pages 的个人博客
  card_announcement:
    enable: true
    content: 欢迎来到我的博客！顶部菜单浏览各栏目，右上角可搜索与切换深色模式
  card_recent_post:
    enable: true
    limit: 5
  card_archives:
    enable: true
    type: monthly
    format: YYYY年MM月
  card_tags:
    enable: true
    limit: 20
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    runtime_date: 2026-09-05

# 页脚
footer:
  owner:
    enable: true
    since: 2026
  custom_text: 托管于 GitHub Pages

# 站点图标与头像（路径相对站点根，url_for 会自动补 /my-blog 前缀）
favicon: /img/favicon.svg
avatar:
  img: /img/avatar.svg
  effect: false

# 首页横幅与文章默认封面
index_img: /img/banner.svg
index_top_img_height: 420px

# 首页横幅上的打字机副标题
subtitle:
  enable: true
  effect: true
  source: false
  sub:
    - 这里记录我的技术笔记、学习心得与生活随想
    - 顶部菜单浏览各栏目，右上角可搜索

# 社交链接（侧栏作者卡片下方）
social:
  fab fa-github: https://github.com/guijie060304-pixel || GitHub || '#24292e'
  fas fa-rss: /my-blog/atom.xml || RSS || '#f26522'

cover:
  default_cover:
    - /img/cover-1.svg
    - /img/cover-2.svg
    - /img/cover-3.svg

# 评论系统：giscus（基于 GitHub Discussions）
comments:
  use: Giscus
  text: true
  count: true

giscus:
  repo: guijie060304-pixel/my-blog
  repo_id: R_kgDOUPSj6A
  category_id: DIC_kwDOUPSj6M4DE8KG
  light_theme: light
  dark_theme: dark

# 暗色模式：带切换按钮，跟随系统自动切换
darkmode:
  enable: true
  button: true
  autoChangeMode: 1

# 代码块：Mac 风格窗口 + 一键复制 + 语言标注
code_blocks:
  theme: light
  macStyle: true
  height_limit: false
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

# 图片点击放大（灯箱）
lightbox: fancybox

# 右下角返回顶部按钮显示阅读百分比
rightside_scroll_percent: true

# 404 页面
error_404:
  enable: true
  subtitle: 页面不存在或已被移动
  background: /img/banner.svg

# 简繁转换（右下角「繁」字按钮）
translate:
  enable: true
  default: 繁
  defaultEncoding: 2

# 数学公式（KaTeX，写 $...$ 即可渲染）
math:
  use: katex
  per_page: true

# 流程图/时序图（Mermaid）
mermaid:
  enable: true
  code_write: false
  theme: default

# 自定义样式：桌面端两栏互换（侧栏在左，文章在右）；加宽容器、加大栏间距；手机端不受影响
inject:
  head:
    - '<style>@media screen and (min-width:900px){#content-inner.layout{flex-direction:row-reverse;max-width:1400px;column-gap:25px}#aside-content{padding-left:0;padding-right:0;width:25%}}</style>'
