# Butterfly 主题站点级配置（覆盖主题默认值）
# 文档：https://butterfly.js.org/

# 顶部导航
nav:
  left:
    - text: 首页
      url: /
    - text: 归档
      url: /archives/
    - text: 标签
      url: /tags/
    - text: 分类
      url: /categories/
    - text: 关于
      url: /about/

# 本地搜索（配合 hexo-generator-search）
local_search:
  enable: true

# 字数统计与阅读时长（hexo-wordcount）
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# 不蒜子站点访问量统计
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# 侧栏
aside:
  enable: true
  card_author:
    enable: true
    description: 基于 Hexo 与 GitHub Pages 的个人博客
  card_recent_post:
    enable: true
    limit: 5
  card_archives:
    enable: true
    type: monthly
    format: YYYY年MM月
  card_tags:
    enable: true
    limit: 20

# 页脚
footer:
  owner:
    enable: true
    since: 2026
  custom_text: 托管于 GitHub Pages

# 站点图标与头像（路径相对站点根，url_for 会自动补 /my-blog 前缀）
favicon: /img/favicon.svg
avatar:
  img: /img/avatar.svg
  effect: false

# 首页横幅与文章默认封面
index_img: /img/banner.svg
cover:
  default_cover:
    - /img/cover-1.svg
    - /img/cover-2.svg
    - /img/cover-3.svg

# 评论系统：giscus（基于 GitHub Discussions）
comments:
  use: Giscus
  text: true
  count: true

giscus:
  repo: guijie060304-pixel/my-blog
  repo_id: R_kgDOUPSj6A
  category_id: DIC_kwDOUPSj6M4DE8KG
  light_theme: light
  dark_theme: dark

# 暗色模式：带切换按钮，跟随系统自动切换
darkmode:
  enable: true
  button: true
  autoChangeMode: 1

# 代码块：Mac 风格窗口 + 一键复制 + 语言标注
code_blocks:
  theme: light
  macStyle: true
  height_limit: false
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

# 图片点击放大（灯箱）
lightbox: fancybox

# 右下角返回顶部按钮显示阅读百分比
rightside_scroll_percent: true

# 404 页面
error_404:
  enable: true
  subtitle: 页面不存在或已被移动
  background: /img/banner.svg
